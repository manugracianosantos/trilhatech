<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Corrigido "stylesheet" -->
    <link rel="stylesheet" href="../style/home-style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">    <title>Home page</title>
    <script src="../services/home.js"></script>
    <title>Home Page</title>
</head>
<body>
    <header class="main-header">
         <a href="home.html">
             <img src="../assets/logo.png" alt="Logo da Trilha Tech" class="logo">
         </a>        
        <nav class="header-nav"> 
            <a href="calendar.html">
                <button class="calendar-btn">Seu calendário</button>
            </a>
            <a href="profile.html">
                <button class="profile-btn">
                    <img src="../assets/perfil.png" alt="Perfil do usuário">
                </button>
            </a>
        </nav>
    </header>

    <main class="container py-4">
        <!-- Eventos em Alta com Carrossel Bootstrap -->
        <section class="mb-5">
            <h2 class="section-title">Eventos em Alta</h2>
            
            <div id="carouselEventosAlta" class="carousel slide carousel-eventos" data-bs-ride="carousel">
                <div class="carousel-inner" id="carousel-inner-alta">
                    <!-- Conteúdo será preenchido pelo JavaScript -->
                </div>
                

            </div>
        </section>

<!-- Região Metropolitana de Campinas com Carrossel -->
<section class="mb-5">
    <h2 class="section-title">Região Metropolitana de Campinas</h2>
    
    <div id="carouselRMC" class="carousel slide carousel-eventos" data-bs-ride="carousel">
        <div class="carousel-inner" id="eventos-rmc">
            <!-- Conteúdo será preenchido pelo JavaScript -->
        </div>
        
        <!-- Controles do carrossel (opcional) -->
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselRMC" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselRMC" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Próximo</span>
        </button>
    </div>
</section>
        
    </main>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</html>
