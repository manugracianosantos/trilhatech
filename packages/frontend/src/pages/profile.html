<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/profile-style.css">
    <title>Tela de perfil</title>
</head>
<body>
    <header class="main-header">
        <a href="home.html">
            <img src="../assets/logo.png" alt="Logo da Trilha Tech" class="logo">
        </a>
        
        <nav class="header-nav"> 
            <a href="calendar.html">
                <button class="calendar-btn">Seu calendário</button>
            </a>
            <a href="profile.html">
                <button class="profile-btn">
                    <img src="../assets/perfil.png" alt="Perfil do usuário" id="profile-icon">
                </button>
            </a>
        </nav>
    </header>

    <div class="main">
        <div class="containers">
            <div class="lado-infos">
                <div class="imagens-perfil">
                    <img src="../assets/banner-profile.png" alt="Banner do perfil" class="banner" id="banner-image">
                    <img src="../assets/semperfil.jpeg" alt="Foto de perfil" class="foto-de-perfil" id="profile-image">
                </div>
        
                <div class="names-info">
                    <h1 id="user-name">User Name</h1>
                    <h2 id="user-area">Área da tecnologia</h2>
                </div>
        
                <div class="forms-com-informações">
                    <form id="profile-form">
                        <label for="nome">Nome completo</label><br>
                        <input type="text" id="nome" name="nome" required /><br><br>
        
                        <label for="email">Email</label><br>
                        <input type="email" id="email" name="email" required/><br><br>
        
                        <label for="senha">Senha</label><br>
                        <input type="password" id="senha" name="senha" required /><br>
                    </form>
                    <div class="coitainerbotao">
                        <button type="button" class="btn-edit">SALVAR ALTERAÇÕES</button>
                    </div>
                </div>
            </div>
            <div class="lado-recomendacoes">
                <h1>Conheça outros eventos!</h1>
                <!-- Os cards serão gerados dinamicamente pelo JavaScript -->
            </div>
        </div>
    </div>

    <script src="../services/profile.js"></script>
</body>
</html>
