<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tela de Login TrilhaTech</title>
  <link rel="stylesheet" href="../style/login.css">
</head>

<body>
  <div class="container-principal">
  <div class="container-formulario">
   <img src="../assets/bemvindo.png" alt="imgBemvindo">
    <form>
      <label for="nome">Nome completo</label><br>
      <input type="text" id="nome" name="nome" required /><br><br>

      <label for="email">Email</label><br>
      <input type="email" id="email" name="email" required/><br><br>

      <label for="senha">Senha</label><br>
      <input type="password" id="senha" name="senha" required /><br>

      <div class="codigo-opcoes">
        <a href="../assets/recSenha.html" class="esqueceu-senha">Esqueceu sua senha?</a>
        <label><input type="checkbox" name="manter-logado" /> Entrar automaticamente</label>
      </div>

      <button type="submit" class="btn-entrar">ENTRAR</button>
    </form>

    <p>Não tem uma conta? <a href="../pages/cadastro.html" class="link-cadastro">Cadastre-se</a></p>
  </div>

  <div class="container-imagem">
    <img src="../assets/imagemlado.png" alt="imgLogin" />
  </div>
</div>
</body>

</html>
